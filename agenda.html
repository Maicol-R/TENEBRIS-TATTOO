<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenebris Tattoo - Agenda</title>
  <!-- Fuentes de Google -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS (necesario para los tooltips y estilos) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
  <!-- Tu CSS personalizado -->
  <link href="styles.css" rel="stylesheet">
  <!-- Favicon -->
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>

<body>
  <!-- Header (como ya tienes) -->
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">TENEBRIS TATTOO</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html#intro">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#galeria">Galería</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#testimonios">Testimonios</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#contacto">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Contenido principal -->
  <main class="container my-5">
    <h1 class="text-center agenda-title">Agenda</h1>

    <!-- Buscador de citas -->
    <div class="search-container mb-3">
      <div class="input-group">
        <input type="text" class="form-control" id="eventSearch" placeholder="Buscar citas...">
        <button class="btn btn-secondary" id="searchBtn">Buscar</button>
        <button class="btn btn-outline-secondary" id="clearSearchBtn">Limpiar</button>
      </div>
    </div>

    <!-- Contenedor del Calendario -->
    <div id="calendar"></div>
  </main>

  <!-- Modal para crear/editar citas -->
  <div id="modal" class="custom-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Detalles de la Cita</h3>
        <button type="button" class="close">&times;</button>
      </div>
      <form id="appointmentForm">
        <!-- Campo oculto para identificar el evento en modo edición -->
        <input type="hidden" id="eventId" value="">
        <div class="mb-3">
          <label for="name" class="form-label">Nombre</label>
          <input type="text" class="form-control" id="name" placeholder="Ingresa tu nombre" required>
        </div>
        <div class="mb-3">
          <label for="hora" class="form-label">Hora</label>
          <input type="time" class="form-control" id="hora" required>
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">Número Telefónico</label>
          <input type="tel" class="form-control" id="telefono" placeholder="Ingresa tu número" required>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary" id="saveBtn">Guardar Cita</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" style="display: none;">Eliminar Cita</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notificación (Toast) -->
  <div id="notification" class="custom-notification" style="display: none;">
    <p id="notificationMessage"></p>
  </div>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Tenebris Tattoo - Todos los derechos reservados a CodeTech.</p>
    <div class="social-icons">
      <a href="https://www.facebook.com/tu_pagina" target="_blank" class="social-link">
        <i class="fab fa-facebook-f"></i>
      </a>
      <a href="https://www.instagram.com/tu_pagina" target="_blank" class="social-link">
        <i class="fab fa-instagram"></i>
      </a>
      <a href="https://www.tiktok.com/@tu_pagina" target="_blank" class="social-link">
        <i class="fab fa-tiktok"></i>
      </a>
    </div>
  </footer>

  <!-- Scripts -->
  <!-- FullCalendar principal -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <!-- Archivo de localización de FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales-all.min.js"></script>
  <!-- Bootstrap Bundle (incluye Popper) para tooltips -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Tu archivo de JavaScript -->
  <script src="app.js"></script>
</body>

</html>
